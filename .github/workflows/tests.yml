name: tests

# Runs the Python + JS suites on every push/PR, with the keyless extra installed
# so the sigstore-API guard (tests/test_keyless_api.py) actually executes. The
# first public seal broke on a sigstore rename the offline suite never exercised;
# this makes that class of drift fail here instead of at a live seal run.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install with dev + keyless extras
        run: pip install ".[dev,keyless]"
      - name: Python suite (incl. keyless API guard)
        run: python -m pytest -q
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: JS cross-language verifier suite
        run: node --test js/checkseal_verify.test.mjs
